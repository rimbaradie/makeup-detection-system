<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login & Sign Up</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    #bgVideo {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
    }

    #videoOverlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(0, 0, 0, 0.4);
      z-index: -1;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 380px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      position: relative;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .form-box {
      width: 200%;
      display: flex;
      transition: 0.5s ease-in-out;
    }

    .form-container {
      width: 50%;
      padding: 40px;
    }

    h2 {
      color: #ff1493;
      margin-bottom: 20px;
      text-align: center;
      font-size: 32px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: #f9f9f9;
    }

    input:focus {
      border-color: #ff69b4;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #ff69b4;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      margin-top: 10px;
      cursor: pointer;
    }

    button:hover {
      background: #ff1493;
    }

    .toggle-box {
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
      padding: 20px;
      background-color: #f0f0f0;
    }

    .toggle-box button {
      flex: 1;
      padding: 10px 0;
      background: white;
      border: 2px solid #ff69b4;
      border-radius: 30px;
      color: #ff69b4;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
      transition: 0.3s ease-in-out;
    }

    .toggle-box button:hover {
      background: #ffe6f0;
    }

    .toggle-box .active-btn {
      background: #ff1493;
      border-color: #ff1493;
      color: white;
    }

    .move-left {
      transform: translateX(0%);
    }

    .move-right {
      transform: translateX(-50%);
    }

    @media (max-width: 500px) {
      .container {
        width: 90%;
      }
    }

    .options-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #333;
      font-size: 14px;
    }

    .forgot-password {
      font-size: 14px;
      color: #333;
      text-decoration: none;
    }

    .forgot-password:hover {
      text-decoration: underline;
    }

    .remember span {
      white-space: nowrap;
    }

    input[type="checkbox"] {
      accent-color: #ff1493;
    }

  </style>
</head>
<body>

  <video autoplay muted loop id="bgVideo">
    <source src="pic/videoo2.mp4" type="video/mp4" />
    Your browser does not support the video tag.
  </video>

  <div id="videoOverlay"></div>

  <div class="container">
    <div class="toggle-box">
      <button id="loginBtn" class="active-btn">Login</button>
      <button id="signupBtn">Sign Up</button>
    </div>
    <div class="form-box move-left" id="formBox">
      <!-- Login Form -->
      <form class="form-container" action="login.php" method="POST">
        <h2>Login</h2>
        <input type="email" name="email" placeholder="Email" required />
        <input type="password" name="password" placeholder="Password" required />
        <div class="options-row">
          <label class="remember">
            <input type="checkbox" name="rememberMe" id="rememberMe" />
            <span>Remember me</span>
          </label>
          <a href="forgotPassword.html" class="forgot-password">Forgot Password?</a> <!-- Redirect to another page -->
        </div>
        <button type="submit">Login</button>
      </form>

      <!-- Sign Up Form -->
      <form class="form-container" action="signup.php" method="POST">
  <h2>Sign Up</h2>
  <input type="text" name="username" placeholder="Username" required />
  <input type="email" name="email" placeholder="Email" required />
  <input type="password" name="password" placeholder="Password" required />
  <input type="text" name="skin_type" placeholder="Skin Type" required />
  <button type="submit">Sign Up</button>
</form>

    </div>
  </div>

  <script>
    const loginBtn = document.getElementById('loginBtn');
    const signupBtn = document.getElementById('signupBtn');
    const formBox = document.getElementById('formBox');

    loginBtn.addEventListener('click', () => {
      formBox.classList.add('move-left');
      formBox.classList.remove('move-right');
      loginBtn.classList.add('active-btn');
      signupBtn.classList.remove('active-btn');
    });

    signupBtn.addEventListener('click', () => {
      formBox.classList.add('move-right');
      formBox.classList.remove('move-left');
      signupBtn.classList.add('active-btn');
      loginBtn.classList.remove('active-btn');
    });

    // Handle "Remember Me" functionality on login
    document.querySelector('form').addEventListener('submit', function(event) {
      if (document.getElementById('rememberMe').checked) {
        const email = document.querySelector('input[name="email"]').value;
        const password = document.querySelector('input[name="password"]').value;

        // Store credentials in cookies
        document.cookie = `email=${email}; path=/; max-age=${30 * 24 * 60 * 60}`;
        document.cookie = `password=${password}; path=/; max-age=${30 * 24 * 60 * 60}`;
      }
    });
  </script>

</body>
</html>
