<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DermGlam - Makeup Recommended by Dermatologists</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
.video-background {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
    z-index: -1;
}

.video-background video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(0.6);
}

.hero-buttons .btn {
    padding: 12px 25px;
    font-size: 16px;
    border-radius: 30px;
    font-weight: bold;
    cursor: pointer;
    animation: pop-in 0.8s ease-out forwards;
    transform: scale(0);
    opacity: 0;
}

.hero-buttons .btn:nth-child(1) {
    background-color: #ff69b4;
    color: white;
    border: none;
}

.hero-buttons .btn:nth-child(2) {
    background-color: #fff;
    color: #ff69b4;
    border: 2px solid #ff69b4;
}

@keyframes pop-in {
    to {
        transform: scale(1);
        opacity: 1;
    }
}

#playWithSound {
    position: absolute;
    top: 20px;
    right: 20px;
    z-index: 2;
    background-color: rgba(255, 105, 180, 0.8);
    color: white;
    border: none;
    padding: 10px 20px;
    font-size: 16px;
    border-radius: 20px;
    cursor: pointer;
}
#toggleSound {
    position: absolute;
    top: 20px;
    right: 20px;
    z-index: 2;
    background-color: rgba(255, 255, 255, 0.15);
    color: white;
    border: 2px solid #ff69b4;
    padding: 8px;
    font-size: 16px;
    border-radius: 50%;
    cursor: pointer;
    backdrop-filter: blur(6px);
    transition: all 0.3s ease;
    box-shadow: 0 3px 10px rgba(255, 105, 180, 0.3);
}

#toggleSound:hover {
    background-color: rgba(255, 105, 180, 0.3);
    transform: scale(1.1);
}



</style>
</head>
<body>

<section id="homeee" class="hero-section active-section" style="position: relative; overflow: visible; min-height: 100vh;">
    <!-- فيديو خلفي -->
    <div class="video-background">
        <video id="myVideo" autoplay muted loop playsinline>
            <source src="pictures/Skinvideo.MOV" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <!-- زر تشغيل الصوت -->
    <button id="toggleSound"><i class="fas fa-volume-mute"></i></button>



    <div class="container" style="position: relative; z-index: 1; padding-top: 100px; text-align: center; color: white;">
        <div class="hero-content">
            <h2 style="font-size: 2.5em; font-weight: bold;">Your Skin, Dermatologist Approved.</h2>
            <p style="font-size: 1.2em; margin: 20px auto; max-width: 600px;">
                Discover makeup that loves your skin, curated and recommended by leading dermatologists.
            </p>

            <div class="hero-buttons" style="margin-top: 30px;">
                <button id="analyze-btn" class="btn btn-secondary scroll-to-analyzer" style="margin: 10px;">Analyze My Skin</button>
                <button class="btn btn-light-pink scroll-to-products" style="margin: 10px;">Shop Now</button>
            </div>

            <blockquote class="expert-quote" style="margin-top: 40px; background: rgba(255, 255, 255, 0.1); padding: 20px; border-left: 5px solid #ff69b4; max-width: 600px; margin-left: auto; margin-right: auto;">
                “Dermatologist-approved ingredients that enhance, not harm, your skin.”
                <cite style="display: block; margin-top: 10px; color: #ff1493; font-size: 2em; font-weight: bold; font-family: 'Playfair Display', serif;">
    Welcome to world SkinGlam
</cite>


            </blockquote>
        </div>
    </div>

    <div class="wave-divider" style="position: absolute; bottom: 0; left: 0; width: 100%;">
        <svg viewBox="0 0 1440 320">
            <path fill="#fff" fill-opacity="1" d="M0,128L1440,0L1440,320L0,320Z"></path>
        </svg>
    </div>
   

    
</section>
<section id="stories" style="padding: 50px 20px; max-width: 800px; margin: 50px auto 0; color: white; font-family: 'Playfair Display', serif;">
            <h3 style="margin-bottom: 20px; font-size: 2em; font-weight: bold; color: #ff69b4;">قصص المستخدمين</h3>
            <p style="color: black;">هنا نص القصة الأولى...</p>
            <p style="color: black;">وهنا نص القصة الثانية...</p>
            <p style="color: black;">وهكذا...</p>
        </section>

<script>
   const btn = document.getElementById('toggleSound');
const video = document.getElementById('myVideo');
const icon = btn.querySelector('i');

btn.addEventListener('click', function () {
    if (video.muted) {
        video.muted = false;
        video.play();
        icon.classList.remove('fa-volume-mute');
        icon.classList.add('fa-volume-up');
    } else {
        video.muted = true;
        icon.classList.remove('fa-volume-up');
        icon.classList.add('fa-volume-mute');
    }
});

</script>
</body>
</html>
